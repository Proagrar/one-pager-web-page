<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body style="margin:0;padding:0;background:#ffffff;font-family:Arial,Helvetica,sans-serif;">
    <table border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;width:420px;background:#ffffff;">
      <tr>

        <!-- Green left bar -->
        <td style="width:8px;background-color:#c6d92d;padding:0;line-height:0;">&nbsp;</td>

        <!-- Main content -->
        <td style="padding:20px 20px 20px 24px;vertical-align:top;">

          <!--
            Logo: SVG viewBox is 0 0 595.28 283.46.
            Content starts at x≈158 (rectangles), y≈97 (leaf top), ends x≈437, y≈184.
            Render image at 540px wide (scale ≈0.907) then crop dead space:
              margin-left: -143px  (crops left whitespace: 540 × 157.62/595.28)
              margin-top:  -83px   (crops top whitespace with slight breathing room)
            Container clips to 260×95px of visible logo content.
          -->
          <div style="width:260px;height:95px;overflow:hidden;line-height:0;">
            <img
              src="https://proagrar.si/assets/img/Proagrar_LOGO2026-14.svg"
              width="540"
              height="257"
              alt="Proagrar"
              style="display:block;border:0;outline:none;text-decoration:none;width:540px;height:257px;margin-left:-143px;margin-top:-83px;"
            />
          </div>

          <!-- Spacer -->
          <div style="height:20px;"></div>

          <!-- Name -->
          <p style="margin:0 0 4px 0;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#000000;line-height:1.3;">Matej Kralj</p>

          <!-- Company -->
          <p style="margin:0 0 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:400;color:#000000;line-height:1.4;">Proagrar d.o.o.</p>

          <!-- Phone -->
          <p style="margin:0 0 6px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:400;line-height:1.4;">
            <a href="tel:+38641577775" style="color:#000000;text-decoration:underline;">+386 41 577 775</a>
          </p>

          <!-- Email -->
          <p style="margin:0 0 6px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:400;line-height:1.4;">
            <a href="mailto:matej.kralj@proagrar.si" style="color:#000000;text-decoration:underline;">matej.kralj@proagrar.si</a>
          </p>

          <!-- Website -->
          <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:400;color:#000000;line-height:1.4;">proagrar.si</p>

        </td>
      </tr>
    </table>
  </body>
</html>
